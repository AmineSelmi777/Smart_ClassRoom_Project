<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Classroom - Messagerie</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #2563eb; --primary-dark: #1d4ed8; --accent: #06b6d4;
      --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --text-muted: #64748b;
      --border: #e2e8f0; --radius: 14px; --radius-sm: 8px;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg ); color: var(--text); line-height: 1.6; overflow: hidden; }
    header { background: rgba(255,255,255,0.92); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(12px); }
    .header-inner { max-width: 1400px; margin: auto; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 64px; }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-icon { width: 38px; height: 38px; background: linear-gradient(135deg, var(--primary), var(--accent)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .logo-text { font-size: 18px; font-weight: 700; color: var(--text); }
    .account-selector { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: #f1f5f9; border-radius: var(--radius-sm); border: 1px solid var(--border); }
    .account-selector select { background: transparent; border: none; font-size: 14px; font-weight: 500; cursor: pointer; outline: none; }
    .messenger-container { display: flex; height: calc(100vh - 64px); }
    .sidebar { width: 340px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .sidebar-header { padding: 16px 20px; border-bottom: 1px solid var(--border); }
    .search-box input { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: #f8fafc; }
    .conversations-list { flex: 1; overflow-y: auto; padding: 8px; }
    .conversation-item { padding: 12px 16px; border-radius: var(--radius-sm); cursor: pointer; display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
    .conversation-item.active { background: #eff6ff; border: 1px solid var(--primary); }
    .conversation-avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--surface); }
    .messages-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .message { display: flex; gap: 8px; max-width: 70%; }
    .message.sent { align-self: flex-end; flex-direction: row-reverse; }
    .message-bubble { padding: 10px 14px; border-radius: 14px; font-size: 14px; }
    .message.received .message-bubble { background: #f1f5f9; }
    .message.sent .message-bubble { background: var(--primary); color: white; }
    .input-area { padding: 16px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
    .message-input { flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); resize: none; }
    .send-btn { background: var(--primary); color: white; border: none; padding: 0 20px; border-radius: var(--radius-sm); cursor: pointer; }
  </style>
</head>
<body>
<header>
  <div class="header-inner">
    <a href="Accueil.html" class="logo"><div class="logo-icon">🏫</div><span class="logo-text">Smart Classroom</span></a>
    <div class="account-selector">
      <span>👤 Compte :</span>
      <select id="accountSelect" onchange="changeAccount()">
        <option value="">-- Choisir --</option>
        <option value="prof_jean">Prof. Jean</option>
        <option value="prof_marie">Prof. Marie</option>
        <option value="admin_bob">Admin Bob</option>
      </select>
    </div>
    <nav><a href="Accueil.html" style="text-decoration:none; color:var(--text-muted)">← Retour</a></nav>
  </div>
</header>
<div class="messenger-container">
  <div class="sidebar">
    <div class="sidebar-header"><div class="search-box"><input type="text" placeholder="Rechercher..."></div></div>
    <div class="conversations-list" id="conversationsList"></div>
  </div>
  <div class="chat-area">
    <div id="chatContent" style="display:none; flex:1; flex-direction:column;">
      <div class="messages-container" id="messagesContainer"></div>
      <div class="input-area">
        <textarea class="message-input" id="messageInput" placeholder="Message..."></textarea>
        <button class="send-btn" onclick="sendMessage()">Envoyer</button>
      </div>
    </div>
  </div>
</div>
<script>
  const data = {
    prof_jean: [{ id: 1, name: 'Classe A', avatar: '👥', messages: [{ sender: 'system', text: 'Début de conversation', time: '09:00' }] }],
    prof_marie: [{ id: 2, name: 'Admin Bob', avatar: '👨‍💼', messages: [{ sender: 'admin_bob', text: 'Bonjour Marie', time: '10:00' }] }],
    admin_bob: [{ id: 3, name: 'Prof. Jean', avatar: '👨‍🏫', messages: [{ sender: 'prof_jean', text: 'Rapport prêt', time: '11:00' }] }]
  };
  let currentAcc = ''; let currentConv = null;
  function changeAccount() {
    currentAcc = document.getElementById('accountSelect').value;
    const list = document.getElementById('conversationsList');
    if (!currentAcc) { list.innerHTML = ''; return; }
    list.innerHTML = data[currentAcc].map(c => `<div class="conversation-item" onclick="selectConv(${c.id})"><div class="conversation-avatar">${c.avatar}</div><div>${c.name}</div></div>`).join('');
  }
  function selectConv(id) {
    currentConv = data[currentAcc].find(c => c.id === id);
    document.getElementById('chatContent').style.display = 'flex';
    renderMessages();
  }
  function renderMessages() {
    const cont = document.getElementById('messagesContainer');
    cont.innerHTML = currentConv.messages.map(m => `<div class="message ${m.sender === currentAcc ? 'sent' : 'received'}"><div class="message-bubble">${m.text}</div></div>`).join('');
  }
  function sendMessage() {
    const input = document.getElementById('messageInput');
    if (!input.value.trim()) return;
    currentConv.messages.push({ sender: currentAcc, text: input.value });
    input.value = ''; renderMessages();
  }
</script>
</body>
</html>
